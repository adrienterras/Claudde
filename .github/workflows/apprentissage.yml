# Apprend les réglages de découpe à partir des retouches partagées par les utilisateurs
# (collage/tools/apprendre.js) : chaque lundi matin, ou à la main depuis l'onglet Actions.
# Les exemples sont téléchargés dans l'espace temporaire du runner avec la clé service de Supabase
# (secret SUPABASE_SERVICE_ROLE_KEY du dépôt), jamais écrits dans le dépôt ; seuls les réglages
# appris (collage/js/cut-learned.js) et le rapport (docs/APPRENTISSAGE.md) sont validés et poussés,
# ce qui republie l'atelier.
name: Apprentissage de la découpe

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apprentissage
  cancel-in-progress: false

jobs:
  apprendre:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: collage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collage/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Télécharger les retouches et apprendre
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tools/apprendre.js --data "$RUNNER_TEMP/retouches"
      - name: Valider et pousser le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/cut-learned.js ../docs/APPRENTISSAGE.md
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Apprentissage de la découpe : réglages et rapport du $(date -u +%Y-%m-%d)"
          git push origin HEAD:${GITHUB_REF_NAME}
