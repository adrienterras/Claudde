# Publie l'application Atelier Gribouille (dossier collage/) sur GitHub Pages.
# Déclenché à chaque push sur la branche de l'application, ou à la main depuis l'onglet Actions.
name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/children-drawings-art-app-kr5f77]
    paths: [collage/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Activer Pages si besoin
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer le site
        run: |
          mkdir -p site
          cp -r collage/. site/
          rm -f site/README.md
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
