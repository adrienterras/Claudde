# Publie l'application Atelier Gribouille (dossier collage/) sur GitHub Pages.
# Déclenché à chaque push sur la branche de l'application, ou à la main depuis l'onglet Actions.
# La suite de tests passe d'abord (tests.yml) : si un seul test échoue, rien n'est publié.
name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/children-drawings-art-app-kr5f77]
    paths: [collage/**, landing/**, deploy/**, .github/workflows/pages.yml, .github/workflows/tests.yml]
  workflow_dispatch:

# (droits donnés job par job : les tests n'ont que la lecture)
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Cloudflare Pages : publié seulement quand la clé est enregistrée dans les secrets du dépôt
      # (Settings → Secrets and variables → Actions : CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID)
      CF_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Activer Pages si besoin
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      # Un run relancé sur un ancien commit ne doit pas écraser un site plus récent :
      # on ne déploie que si ce commit est encore la pointe de la branche.
      - name: Vérifier que le commit est le plus récent
        run: |
          # (lancé à la main depuis une autre branche : refusé, seule la branche de production se publie)
          if [ "$GITHUB_REF_NAME" != "claude/children-drawings-art-app-kr5f77" ]; then
            echo "::error::Seule la branche de production se publie (ici : ${GITHUB_REF_NAME})."
            exit 1
          fi
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          tip="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::Ce run concerne ${GITHUB_SHA:0:7} mais la branche est à ${tip:0:7} : déploiement refusé pour ne pas revenir en arrière. Relancez le run du dernier commit."
            exit 1
          fi
      - name: Préparer le site
        run: bash deploy/preparer-site.sh "$GITHUB_SHA"
      # Le même site, sur Cloudflare Pages (projet « ateliergribouille », envoi direct) : publié ici,
      # après les tests, et non par Cloudflare depuis le dépôt (qui publierait sans les tests)
      - name: Publier sur Cloudflare Pages
        if: env.CF_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          W="npx --yes wrangler@4.152.0"
          # (le projet est créé au premier envoi ; ensuite, la création échoue sans conséquence)
          $W pages project create ateliergribouille --production-branch=main || echo "Projet déjà créé"
          for i in 1 2 3; do
            $W pages deploy _site --project-name=ateliergribouille --branch=main --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA:0:7}" && exit 0
            echo "Nouvel essai dans $((i * 20)) s"; sleep $((i * 20))
          done
          exit 1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      # Le service Pages met parfois plus de 10 min (le maximum accepté par l'action) : on retente
      # une fois avant de déclarer l'échec. L'URL du site vient de la tentative qui a réussi.
      - id: deploy1
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 20
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 600000
          error_count: 20
      - id: deployment
        env:
          PAGE_URL: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
        run: echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
