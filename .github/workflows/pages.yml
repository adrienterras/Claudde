# Publie l'application Atelier Gribouille (dossier collage/) sur GitHub Pages.
# Déclenché à chaque push sur la branche de l'application, ou à la main depuis l'onglet Actions.
name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/children-drawings-art-app-kr5f77]
    paths: [collage/**, landing/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Activer Pages si besoin
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # Un run relancé sur un ancien commit ne doit pas écraser un site plus récent :
      # on ne déploie que si ce commit est encore la pointe de la branche.
      - name: Vérifier que le commit est le plus récent
        run: |
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          tip="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::Ce run concerne ${GITHUB_SHA:0:7} mais la branche est à ${tip:0:7} : déploiement refusé pour ne pas revenir en arrière. Relancez le run du dernier commit."
            exit 1
          fi
      - name: Préparer le site
        run: |
          mkdir -p _site/atelier
          cp -r collage/. _site/atelier/
          rm -rf _site/atelier/README.md _site/atelier/tests _site/atelier/node_modules _site/atelier/package.json _site/atelier/package-lock.json _site/atelier/playwright.config.js _site/atelier/.gitignore
          cp -r landing/. _site/
          cp collage/confidentialite.html _site/confidentialite.html
          # Chaque déploiement change l'adresse des scripts et de la feuille de style : les navigateurs
          # (Safari surtout) ne gardent plus une vieille version en cache après une mise à jour.
          V="${GITHUB_SHA:0:8}"
          sed -i -E "s#(src=\"(js/[a-z0-9-]+|config)\.js)\"#\1?v=$V\"#g; s#href=\"style\.css\"#href=\"style.css?v=$V\"#" _site/atelier/index.html
          sed -i -E "s#(src=\"[a-z0-9-]+\.js)\"#\1?v=$V\"#g; s#(href=\"[a-z0-9-]+\.css)\"#\1?v=$V\"#g" _site/index.html _site/tarifs.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
