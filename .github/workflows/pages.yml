# Publie le site Atelier Gribouille (accueil landing/ et atelier collage/) sur Cloudflare Pages
# (projet « ateliergribouille », domaine ateliergribouille.art) ; GitHub Pages n'est plus utilisé.
# Déclenché à chaque push sur la branche de l'application, ou à la main depuis l'onglet Actions.
# La suite de tests passe d'abord (tests.yml) : si un seul test échoue, rien n'est publié.
name: Publier le site

on:
  push:
    branches: [claude/children-drawings-art-app-kr5f77]
    paths: [collage/**, landing/**, deploy/**, supabase/functions/**, supabase/config.toml, .github/workflows/pages.yml, .github/workflows/tests.yml]
  workflow_dispatch:

# (droits donnés job par job : les tests n'ont que la lecture)
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://ateliergribouille.art
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Un run relancé sur un ancien commit ne doit pas écraser un site plus récent :
      # on ne déploie que si ce commit est encore la pointe de la branche.
      - name: Vérifier que le commit est le plus récent
        run: |
          # (lancé à la main depuis une autre branche : refusé, seule la branche de production se publie)
          if [ "$GITHUB_REF_NAME" != "claude/children-drawings-art-app-kr5f77" ]; then
            echo "::error::Seule la branche de production se publie (ici : ${GITHUB_REF_NAME})."
            exit 1
          fi
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          tip="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::Ce run concerne ${GITHUB_SHA:0:7} mais la branche est à ${tip:0:7} : déploiement refusé pour ne pas revenir en arrière. Relancez le run du dernier commit."
            exit 1
          fi
      - name: Préparer le site
        run: bash deploy/preparer-site.sh "$GITHUB_SHA"
      # Cloudflare Pages (projet « ateliergribouille », envoi direct) : publié ici, après les tests, et
      # non par Cloudflare depuis le dépôt (qui publierait sans les tests). Clé dans les secrets du
      # dépôt (Settings → Secrets and variables → Actions : CLOUDFLARE_API_TOKEN, jeton « Cloudflare
      # Pages : Modifier », et CLOUDFLARE_ACCOUNT_ID).
      - name: Publier sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Publication impossible : secret absent (CLOUDFLARE_API_TOKEN : $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo présent || echo absent), CLOUDFLARE_ACCOUNT_ID : $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo présent || echo absent))"
            exit 1
          fi
          W="npx --yes wrangler@4.152.0"
          for i in 1 2 3; do
            $W pages deploy _site --project-name=ateliergribouille --branch=main --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA:0:7}" --commit-dirty=true && exit 0
            echo "Nouvel essai dans $((i * 20)) s"; sleep $((i * 20))
          done
          exit 1
      # Fonctions Supabase du paiement en ligne (supabase/functions : « commande », « stripe-webhook »,
      # « commande-statut », « commande-annuler ») et du partage des œuvres (« partage »),
      # déployées après le site. Clé dans les secrets du dépôt : SUPABASE_ACCESS_TOKEN (Supabase → Account
      # preferences → Access Tokens). Sans elle, l'étape est sautée (le site est publié quand même).
      # Les clés Stripe sont dans Supabase (Edge Functions → Secrets), jamais ici. Les deux fonctions
      # vérifient elles-mêmes l'appelant (compte connecté ; signature Stripe) : --no-verify-jwt.
      - name: Déployer les fonctions Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Fonctions Supabase non déployées : secret SUPABASE_ACCESS_TOKEN absent."
            exit 0
          fi
          REF="$(sed -n "s#.*supabaseUrl: 'https://\([a-z0-9]*\)\.supabase\.co'.*#\1#p" collage/config.js)"
          if [ -z "$REF" ]; then echo "::error::Projet Supabase introuvable dans collage/config.js"; exit 1; fi
          for f in commande stripe-webhook commande-statut commande-annuler partage; do
            ok=0
            for i in 1 2 3; do
              npx --yes supabase@2 functions deploy "$f" --project-ref "$REF" --no-verify-jwt && { ok=1; break; }
              echo "Nouvel essai dans $((i * 20)) s"; sleep $((i * 20))
            done
            [ "$ok" = 1 ] || exit 1
          done
