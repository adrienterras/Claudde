# Lance la suite de tests d'Atelier Gribouille (collage/tests) à chaque push et pull request.
name: Tests

on:
  push:
    paths: ['collage/**', 'livre/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['collage/**', 'livre/**', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: collage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collage/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: rapport-playwright
          path: |
            collage/playwright-report
            collage/test-results
          retention-days: 14
